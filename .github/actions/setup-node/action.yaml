name: "CI setup"
inputs:
  node-version:
    description: "Node version"
    default: 22.13.1
  pnpm-version:
    description: "PNPM major used in the cache key"
    # The exact installed version comes from package.json#packageManager.
    default: 9
  install:
    description: "Should install?"
    default: true
runs:
  using: "composite"
  steps:
    - name: Cache PNPM modules
      uses: actions/cache@v3
      with:
        path: ~/.local/share/pnpm/store/v3
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-pnpm-${{ inputs.pnpm-version }}-lock-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        run_install: ${{ inputs.install }}
